name: SEO & Build Quality
on:
  push:
    branches: [fix/seo-leads-cikupa-20261019]
  pull_request:
    branches: [feat/next-three-refactor]
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
